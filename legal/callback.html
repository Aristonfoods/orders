<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ariston Stock Check - Connect</title><style>body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;color:#222}code{display:block;word-break:break-all;background:#f3f3f3;padding:12px;border-radius:6px;margin:12px 0}button{padding:8px 14px;font-size:15px}</style></head><body><h1>Ariston Stock Check</h1><p id="msg">Waiting for the connection result...</p><code id="code" hidden></code><button id="copy" hidden>Copy</button><script>var p=new URLSearchParams(location.search),c=p.get("code"),r=p.get("realmId"),e=p.get("error"),m=document.getElementById("msg");if(c){var v="code="+c+"&realmId="+(r||"")+"&state="+(p.get("state")||"");m.textContent="Connected. Copy the text below and paste it into the Ariston Stock Check tool on your PC. Do not share it. This page does not store or send it anywhere.";var k=document.getElementById("code");k.textContent=v;k.hidden=false;var b=document.getElementById("copy");b.hidden=false;b.onclick=function(){navigator.clipboard.writeText(v);b.textContent="Copied"};history.replaceState(null,"",location.pathname)}else if(e){m.textContent="The connection was not completed ("+e+"). You can close this page and try again."}else{m.textContent="This page is used by the Ariston Stock Check tool for the one-time QuickBooks connection. Nothing to do here."}</script></body></html>
